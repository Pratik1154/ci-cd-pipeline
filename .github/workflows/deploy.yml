name: Spring Boot build and deploy

on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: Spring-boot-app

jobs:
  build-deploy: # job name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: SettingUp java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar
        run : mvn clean package -DskipTests

      - name: Building Docker Image
        run : docker build -t ${{ secrets.DOCKER_USERNAME }} / ${{ env.IMAGE_NAME }}:latest .

      - name : Login to Docker Hub
        run : docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name : Push Image to Docker Hub
        run : docker push ${{ secrets.DOCKER_USERNAME }} / ${{ env.IMAGE_NAME }}:latest

      - name : Deploy to EC2
        uses: appleboy/ssh-action@v1
        with :
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_SSH_KEY }}
          scripts: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker stop spring-boot-app || true
            docker rm spring-boot-app || true
            docker run -d --name spring-boot-app --restart unless-stoped -p 8081:8081 ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker image prune -f

